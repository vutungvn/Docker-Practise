name: bai7 Rollback
run-name: Rollback ${{ inputs.environment }} to ${{ inputs.version || 'previous version' }} - ${{ inputs.reason }}

# Runbook: bai7/ROLLBACK.md. Run it from the main branch ("Use workflow from: main").
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        type: choice
        options: [production, staging]
        required: true
      version:
        description: Commit SHA to go back to (leave empty = the version that ran before the current one)
        type: string
        required: false
      reason:
        description: Why (incident link / short note)
        type: string
        required: true

permissions:
  contents: read

jobs:
  rollback:
    name: Rollback
    uses: ./.github/workflows/bai7-deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      environment: ${{ inputs.environment }}
      version: ${{ inputs.version }}
      rollback: true
      reason: ${{ inputs.reason }}
