name: bai7 CD

# develop -> test -> build -> deploy staging (automatic)
# main    -> test -> build -> wait for approval -> deploy production
on:
  push:
    branches: [develop, main]
    paths:
      - "bai7/**"
      - ".github/workflows/bai7-*.yml"
  workflow_dispatch: # rebuild/redeploy the head of a branch manually

permissions:
  contents: read

env:
  IMAGE_NAME: shopfast-bai7

jobs:
  # Re-test the merged result: protects against direct pushes and against two PRs that only break together.
  ci:
    name: CI
    uses: ./.github/workflows/bai7-ci.yml

  build:
    name: Build & push image (tag = commit SHA)
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every image is tagged with its full commit SHA, so any version can be redeployed later.
      # No moving "latest" tag: deploy.sh maintains the "staging"/"production" pointer tags itself.
      - uses: docker/build-push-action@v6
        with:
          context: bai7
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=bai7
          cache-to: type=gha,mode=max,scope=bai7

      - name: Summary
        run: echo "Pushed \`$IMAGE:$GITHUB_SHA\` (branch \`$GITHUB_REF_NAME\`)" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Staging
    if: github.ref == 'refs/heads/develop'
    needs: build
    uses: ./.github/workflows/bai7-deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      environment: staging
      version: ${{ github.sha }}

  deploy-production:
    name: Production
    if: github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/bai7-deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      environment: production # required reviewers on this environment => the run pauses here for approval
      version: ${{ github.sha }}
