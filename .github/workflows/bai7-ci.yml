name: bai7 CI

# Runs on every pull request into develop/main, and is reused by bai7-cd.yml after a merge.
# Branch protection requires the "bai7 CI passed" check, so a red run disables the merge button.
on:
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

# A new push to the same PR cancels the outdated run (never cancel runs that lead to a deploy).
concurrency:
  group: bai7-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: bai7

jobs:
  changes:
    name: Detect bai7 changes
    runs-on: ubuntu-latest
    outputs:
      bai7: ${{ steps.diff.outputs.bai7 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # PRs that do not touch bai7 skip the jobs below; skipped jobs still satisfy the required check.
      - id: diff
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
             git diff --name-only "$BASE...$HEAD" | grep -qE '^(bai7/|\.github/workflows/bai7-)'; then
            echo "bai7=true" >> "$GITHUB_OUTPUT"
          else
            echo "bai7=false" >> "$GITHUB_OUTPUT"
          fi

  format:
    name: Format & type check
    needs: changes
    if: needs.changes.outputs.bai7 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bai7/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run typecheck

  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.bai7 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bai7/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit

  integration:
    name: Integration tests (Postgres)
    needs: changes
    if: needs.changes.outputs.bai7 == 'true'
    runs-on: ubuntu-latest
    # Throwaway database for this job only: trust auth, so there is no password to manage.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shopfast_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/shopfast_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bai7/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:integration

  # The single check that branch protection requires.
  ci-passed:
    name: bai7 CI passed
    if: always()
    needs: [changes, format, unit, integration]
    runs-on: ubuntu-latest
    steps:
      - working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) echo "::error::A required job failed - merging is blocked"; exit 1 ;;
          esac
