name: bai7 deploy (reusable)

# Shared by bai7-cd.yml (deploy) and bai7-rollback.yml (rollback), so both go through
# the same environment protection, the same secrets and the same concurrency lock.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      version:
        description: Commit SHA (full or short). Empty with rollback = the version before the current one.
        type: string
        default: ""
      rollback:
        type: boolean
        default: false
      reason:
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: ${{ inputs.rollback && 'Rollback' || 'Deploy' }} ${{ inputs.environment }}
    # Default: a throwaway GitHub-hosted runner (environment simulated on the runner, state kept as image tags).
    # Set repo variable DEPLOY_RUNS_ON to a self-hosted runner label on the real server (+ DEPLOY_STATE=file).
    runs-on: ${{ vars.DEPLOY_RUNS_ON || 'ubuntu-latest' }}
    environment:
      name: ${{ inputs.environment }}
    # Trap 1: one deploy/rollback per environment at a time. A second one waits instead of running in parallel;
    # cancel-in-progress=false so a running deploy is never killed halfway.
    concurrency:
      group: bai7-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 10
    env:
      ENV_NAME: ${{ inputs.environment }}
      VERSION: ${{ inputs.version }}
      REASON: ${{ inputs.reason }}
      ROLLBACK: ${{ inputs.rollback }}
      # Per-environment values: secrets/vars of the GitHub Environment named above.
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      APP_PORT: ${{ vars.APP_PORT }}
      DEPLOY_STATE: ${{ vars.DEPLOY_STATE || 'registry' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # deploy.sh compares commits to refuse overwriting a newer release

      - name: Resolve image and version
        run: |
          [ -n "$DB_PASSWORD" ] || { echo "::error::Secret DB_PASSWORD is not set on environment '$ENV_NAME'"; exit 1; }
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shopfast-bai7" >> "$GITHUB_ENV"
          if [ -n "$VERSION" ]; then
            full=$(git rev-parse --verify --quiet "${VERSION}^{commit}") ||
              { echo "::error::'$VERSION' is not a commit of this repository"; exit 1; }
            echo "VERSION=$full" >> "$GITHUB_ENV"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ${{ inputs.rollback && 'Roll back' || 'Backup, migrate, switch, verify' }}
        id: run
        working-directory: bai7
        run: |
          if [ "$ROLLBACK" = true ]; then
            bash deploy/rollback.sh "$ENV_NAME" "$VERSION"
          else
            bash deploy/deploy.sh "$ENV_NAME" "$VERSION"
          fi

      - name: Summary
        if: always()
        env:
          RESULT: ${{ steps.run.outcome == 'success' && steps.run.outputs.result || 'FAILED - previous version kept' }}
          NEW: ${{ steps.run.outputs.version }}
          PREVIOUS: ${{ steps.run.outputs.previous }}
          SECONDS_TAKEN: ${{ steps.run.outputs.total || steps.run.outputs.duration }}
        run: |
          {
            echo "### $([ "$ROLLBACK" = true ] && echo Rollback || echo Deploy) \`$ENV_NAME\`"
            echo "| | |"
            echo "|---|---|"
            echo "| Result | $RESULT |"
            echo "| Now serving | \`${NEW:-$VERSION}\` |"
            echo "| Previously | \`${PREVIOUS:-none}\` |"
            echo "| Script time | ${SECONDS_TAKEN:-?}s |"
            [ -n "$REASON" ] && echo "| Reason | $REASON |"
            echo "| Image | \`$IMAGE:${NEW:-$VERSION}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
