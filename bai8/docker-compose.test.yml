# Throwaway Postgres for the integration tests only (trust auth, 127.0.0.1 only).
#   docker compose -f docker-compose.test.yml up -d --wait
#   DATABASE_URL=postgres://postgres@localhost:15434/shopfast_test npm run test:integration
name: shopfast-bai8-test
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopfast_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:15434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20
