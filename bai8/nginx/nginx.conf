worker_processes auto;

# After `nginx -s reload` the old workers keep serving the connections they already hold (including open
# WebSockets) and new workers take new connections with the new upstream. The app drains realtime clients
# within DRAIN_SECONDS; this is only the hard upper bound for an old worker to exit.
worker_shutdown_timeout 5m;

events {
  worker_connections 16384;
}

http {
  access_log off;

  # upstream "live" (port 80) and "preview" (port 81) - written by scripts/blue-green.sh
  include /etc/nginx/bluegreen/upstreams.conf;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_connect_timeout 2s;
  # A container that is stopping/not reachable: retry the request on another one (idempotent requests only).
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 3;

  server {
    listen 80;
    location / {
      proxy_pass http://live;
    }
    location /ws {
      proxy_pass http://live;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }
  }

  server {
    listen 81;
    location / {
      proxy_pass http://preview;
    }
    location /ws {
      proxy_pass http://preview;
      proxy_read_timeout 1h;
    }
  }
}
